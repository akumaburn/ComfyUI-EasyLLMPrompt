[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "easy-llm-prompt"
version = "1.0.0"
description = "Convert a structured scene description into an optimised SDXL prompt via LLM"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "akumaburn"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/akumaburn/ComfyUI-EasyLLMPrompt"

[tool.setuptools.packages.find]
include = ["easy_llm_prompt*"]

[tool.comfy]
PublisherId = "akumaburn"
DisplayName = "Easy LLM Prompt"
requires-comfyui = ">=0.12.0"
